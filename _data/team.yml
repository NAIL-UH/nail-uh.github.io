phd:
  - name: Richie Ryulie Suganda
    program: ECE
    start: Spring 2024
    research: Learning-Based Control & Optimization
    description: Developing safe learning algorithms for layered autonomous systems and integrating large language models for intelligent robotic control applications.
    photo: richie-suganda.jpg
    website: https://richieryu.github.io/
    # Each paper links to its project website, or to the paper itself when there is none.
    publications:
      - label: CoRL 2026
        url: https://nail-uh.github.io/corl2026.github.io/
      - label: IROS 2026
        url: https://nail-uh.github.io/iros2026.github.io/
      - label: IROS-LBS 2026
        url: https://nail-uh.github.io/3d-leader-follower-cbf.github.io/
      - label: RA-L 2026
        url: https://arxiv.org/abs/2607.06535
      - label: AIAA 2026
        url: https://arc.aiaa.org/doi/abs/10.2514/6.2026-2211
      - label: ICRA 2025
        url: https://nail-uh.github.io/icra25.github.io/
      - label: ICRA-LBS 2025
        url: /assets/pdf/LLM.pdf
  - name: Benedictus Christo Geroda Cinun
    program: ECE
    start: Spring 2025
    research: Machine Learning & Robotics
    description: Investigating safe reinforcement learning algorithms for quadruped robot locomotion and dynamic environment navigation systems.
    photo: benedictus-cinun.jpg
    website: https://bentuschristo.github.io/
    publications:
      - label: ACAP 2026
        url: https://onlinelibrary.wiley.com/doi/10.1002/adc2.70050
  - name: Immanuel Raynaldo Santjoko
    program: ECE
    start: Fall 2025
    research: Trustworthy Human-AI Collaboration
    description: Building reliable and transparent AI systems for effective human-AI collaboration through trust mechanisms and explainable AI frameworks.
    photo: immanuel-santjoko.jpg
    website: https://research.noelsadventure.my.id/
    publications:
      - label: IROS-LBS 2026
        url: https://nail-uh.github.io/3d-leader-follower-cbf.github.io/
      - label: ACAP 2026
        url: https://onlinelibrary.wiley.com/doi/10.1002/adc2.70050
  - name: Vieri Akustia
    program: ECE
    start: Fall 2026
    research: Efficient Embodied AI
    description: Developing energy-efficient foundation models for embodied AI, enabling real-time perception and control on resource-constrained edge devices and robotic platforms.
    photo: vieri-akustia.jpg

